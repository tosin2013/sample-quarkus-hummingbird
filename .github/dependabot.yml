version: 2
updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    reviewers:
      - "tosin2013"
    ignore:
      # Netty 4.2.x is incompatible with Quarkus 3.35.x (Vert.x 4.x requires Netty 4.1.x).
      # The 4.1.x line is frozen at 4.1.133.Final. Re-evaluate when Quarkus officially
      # supports Netty 4.2.x (expected with Vert.x 5.x / Quarkus 4.x).
      - dependency-name: "io.netty:netty-bom"
        versions: ["4.2.*"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    reviewers:
      - "tosin2013"

  # Container base images (Containerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    reviewers:
      - "tosin2013"
